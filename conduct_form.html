<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>品德操行数据收集表</title>
<style>
:root {
  --primary: #1677FF;
  --primary-light: #E6F0FF;
  --primary-dark: #0958D9;
  --success: #52C41A;
  --success-dark: #389E0D;
  --danger: #FF4D4F;
  --orange: #FA8C16;
  --bg-main: #F0F2F5;
  --text-1: #1F1F1F;
  --text-2: #595959;
  --text-3: #8C8C8C;
  --border: #E8E8E8;
  --border-light: #F0F0F0;
  --radius: 8px;
  --radius-sm: 6px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg-main); color: var(--text-1); font-size: 14px; overflow-x: hidden; }
input, textarea, select, button { font-family: inherit; font-size: inherit; outline: none; border: none; }

#formView { display: block; max-width: 560px; margin: 40px auto; padding: 32px; min-height: calc(100vh - 80px); background: #fff; border-radius: 12px; box-shadow: 0 2px 24px rgba(0,0,0,0.08); }
.fpv-header { text-align: center; margin-bottom: 24px; }
.fpv-header h2 { font-size: 20px; font-weight: 700; color: var(--text-1); margin-bottom: 6px; }
.fpv-header p { font-size: 13px; color: var(--text-3); }
.fpv-section { margin-bottom: 16px; }
.fpv-section label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; color: var(--text-1); }
.fpv-section .req { color: var(--danger); }
.fpv-section select, .fpv-section textarea, .fpv-section input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; box-sizing: border-box; }
.fpv-section select:focus, .fpv-section textarea:focus { outline: none; border-color: var(--primary); }
.vi-type-option { text-align: center; padding: 10px 4px; background: var(--bg-main); border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; }
.vi-type-option:hover { background: var(--border-light); }
.vi-type-option.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); font-weight: 600; }
.fpv-types { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.fpv-score-row { display: flex; align-items: center; gap: 8px; }
.fpv-score-row input { text-align: center; font-weight: 700; max-width: 80px; }
.fpv-check-list { max-height: 230px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 10px; background: #fff; }
.fpv-check { display: flex; align-items: center; gap: 8px; padding: 7px 2px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border-light); }
.fpv-check:last-child { border-bottom: none; }
.fpv-check input { width: 17px; height: 17px; accent-color: var(--primary); flex-shrink: 0; }
.fpv-check .fpv-check-count { margin-left: auto; color: var(--text-3); font-size: 11px; }
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 8px 16px; font-size: 13px; font-weight: 500; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s; border: 1px solid var(--border); background: #fff; color: var(--text-1); }
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.fpv-upload { border: 2px dashed var(--border); border-radius: var(--radius-sm); padding: 20px; text-align: center; cursor: pointer; background: var(--bg-main); }
.fpv-upload:hover { border-color: var(--primary); }
.fpv-submit { width: 100%; padding: 12px; font-size: 14px; font-weight: 600; border: none; border-radius: var(--radius-sm); background: var(--primary); color: #fff; cursor: pointer; margin-top: 8px; }
.fpv-submit:hover { background: var(--primary-dark); }
.fpv-success { text-align: center; padding: 40px 20px; }
.fpv-success .icon { font-size: 48px; margin-bottom: 12px; }
.fpv-success h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.fpv-success p { font-size: 13px; color: var(--text-3); }
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(0,0,0,0.8); color: #fff; padding: 8px 20px; border-radius: var(--radius-sm); font-size: 13px; z-index: 9999; transition: transform 0.25s; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 600px) {
  #formView { margin: 0; padding: 20px 16px; min-height: 100vh; border-radius: 0; box-shadow: none; }
  .fpv-header h2 { font-size: 18px; }
}
</style>
</head>
<body>

<div id="formView"></div>
<div class="toast" id="toast"></div>

<script>
// ========== Mock Data ==========
const studentNames = ['张三','李四','王五','赵六','钱七','孙八','周九','吴十','郑十一','王十二','刘十三','陈十四','衞十五','蒋十六','沈十七','韩十八','杨十九','朱二十','秦廿一','尤廿二','许廿三','何廿四','吕廿五','施廿六','张廿七','孔廿八','曹廿九','严三十','华卅一','金卅二','魏卅三','陶卅四','姜卅五','戚卅六','谢卅七','邹卅八','喻卅九','柏四十','水四一','窦四二','章四三','云四四','苏四五','潘四六','葛四七','奚四八','范四九','彭五十','鲁五一','韦五二','昌五三','马五四','苗五五','花五六','方五七','俞五八','尤五九','冯六十'];
const avatarColors = ['#1677FF','#52C41A','#FA8C16','#FF4D4F','#722ED1','#13C2C2','#EB2F96','#FAAD14'];
const addresses = ['广州市天河区','广州市越秀区','广州市海珠区','广州市番禺区','广州市白云区','广州市黄埔区','深圳市南山区','佛山市禅城区'];
const students = [];
for (let i = 0; i < 58; i++) {
  const id = String(i+1).padStart(2,'0');
  const fullId = '202403' + id;
  const name = studentNames[i];
  const dorm = '10' + (Math.floor(i/6)+1);
  const color = avatarColors[i % avatarColors.length];
  students.push({ id, fullId, name, dorm, color,
    conduct: { d1:0,d2:0,d3:0,d4:0,d5:0,d6:0,d7:0,d8:0,d9:0,d10:0,d11:0, total:100 }
  });
}

// ========== Supabase 配置层（可选用云端真正同步）==========
// 配置存于 localStorage，由 PC 端“Supabase配置”入口写入。
var SB_URL_KEY = 'smartclass_supabase_url';
var SB_ANON_KEY = 'smartclass_supabase_anon';
var SB_DEFAULT_URL = 'https://sjkvtsgqkzbhkzwpwsvd.supabase.co';
var SB_DEFAULT_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNqa3Z0c2dxa3piaGt6d3B3c3ZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNDcyMjgsImV4cCI6MjEwNDYyMzIyOH0.FYnAwcTXvAZ1kVQKmF9LGDAfhfH3ycjua1D2xCeziv8';
function sbConfig() {
  try {
    // 优先读取分发链接 URL 参数携带的配置（?sbUrl=...&sbKey=...）
    // 这样班长任意设备扫码/打开链接即能写入云端
    var q = location.search;
    if (q) {
      var p = new URLSearchParams(q);
      var u = p.get('sbUrl'), k = p.get('sbKey');
      if (u && k) {
        u = u.replace(/\/+$/, '');
        try { localStorage.setItem(SB_URL_KEY, u); localStorage.setItem(SB_ANON_KEY, k); } catch(e){}
        return { url: u, anon: k };
      }
    }
    return { url: localStorage.getItem(SB_URL_KEY) || SB_DEFAULT_URL, anon: localStorage.getItem(SB_ANON_KEY) || SB_DEFAULT_KEY };
  } catch(e) { return { url: SB_DEFAULT_URL, anon: SB_DEFAULT_KEY }; }
}
function sbEnabled() { var c = sbConfig(); return !!(c.url && c.anon); }
// 通过 PostgREST 向 Supabase 表插入一条记录（匿名+RLS）
function sbInsert(table, row) {
  var c = sbConfig();
  if (!c.url || !c.anon) { return; }
  try {
    fetch(c.url + '/rest/v1/' + table, {
      method: 'POST',
      headers: {
        'apikey': c.anon,
        'Authorization': 'Bearer ' + c.anon,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(row)
    }).catch(function(){});
  } catch(e) {}
}
// 从 Supabase 查询全部记录（默认最新在前）
function sbFetch(table, cb) {
  var c = sbConfig();
  if (!c.url || !c.anon) { if (cb) cb([]); return; }
  fetch(c.url + '/rest/v1/' + table + '?select=*&order=ts.asc', {
    headers: { 'apikey': c.anon, 'Authorization': 'Bearer ' + c.anon }
  }).then(function(r){ return r.json(); }).then(function(d){
    if (Array.isArray(d)) cb(d); else cb([]);
  }).catch(function(){ cb([]); });
}

// ========== 共享同步层（localStorage，与PC端/手机端原型互通）==========
// 收集表提交的记录被 "上传" 到模拟云端(sharedStorage)，两个原型读取后合并渲染。
// 若配置了 Supabase，则同时写入云端数据库，实现真正的跨设备回传。
var COLLECT_STORAGE_KEY = 'smartclass_conduct_collect';
function loadCollectRecords() {
  try { return JSON.parse(localStorage.getItem(COLLECT_STORAGE_KEY)) || []; }
  catch(e) { return []; }
}
function saveCollectRecords(records) {
  try { localStorage.setItem(COLLECT_STORAGE_KEY, JSON.stringify(records)); } catch(e) {}
}
function replayCollectRecords() {
  // 将已上传记录回放到本地学生数据，保证本表单与原型数据一致
  var records = loadCollectRecords();
  records.forEach(function(r) {
    var s = students.find(function(x){ return x.fullId === r.fullId; });
    if (!s) return;
    if (r.dim && s.conduct[r.dim] !== undefined) s.conduct[r.dim] += r.score;
    s.conduct.total = 100;
  });
  records.forEach(function(r) {
    var s = students.find(function(x){ return x.fullId === r.fullId; });
    if (!s) return;
    if (r.dim && s.conduct[r.dim] !== undefined) s.conduct.total += (r.scoreType === '加分' ? r.score : -r.score);
  });
}
replayCollectRecords();
// 若配置了 Supabase，启动时拉取云端记录合并到本地（保证表单数据最新）
function replayCloudRecords() {
  if (!sbEnabled()) return;
  sbFetch('conduct_records', function(rows) {
    var sList = rows.filter(function(r){ return r.full_id; });
    sList.forEach(function(r) {
      var s = students.find(function(x){ return x.fullId === r.full_id; });
      if (!s || !r.dim || s.conduct[r.dim] === undefined) return;
      s.conduct[r.dim] += r.score;
      s.conduct.total += (r.score_type === '加分' ? r.score : -r.score);
    });
  });
}
replayCloudRecords();

// ========== 从云端同步班级名单（class_settings.key='roster'）==========
// PC端/手机端上传的名单存于云端，收集表启动时拉取覆盖本地模拟学生，
// 保证“选择学生”下拉显示的是已上传的真实名单姓名。
function loadCloudRoster() {
  var c = sbConfig();
  if (!c.url || !c.anon || !sbEnabled()) return;
  fetch(c.url + '/rest/v1/class_settings?select=value&key=eq.roster&limit=1', {
    headers: { 'apikey': c.anon, 'Authorization': 'Bearer ' + c.anon }
  }).then(function(r){ return r.json(); }).then(function(d){
    try {
      if (!Array.isArray(d) || !d.length || !d[0].value) return;
      var arr = JSON.parse(d[0].value || '[]');
      if (!Array.isArray(arr) || !arr.length) return;
      students.length = 0;
      arr.forEach(function(s){ students.push(s); });
      // 补齐 conduct 默认值，避免渲染/合计报错
      var dimKeys = ['d1','d2','d3','d4','d5','d6','d7','d8','d9','d10','d11','d12'];
      students.forEach(function(s){
        if (!s.conduct) s.conduct = {};
        dimKeys.forEach(function(k){ if (s.conduct[k] === undefined) s.conduct[k] = 0; });
        if (s.conduct.total === undefined) s.conduct.total = 100;
      });
      replayCollectRecords();
      replayCloudRecords();
      // 若表单已渲染则刷新，确保下拉立即显示新名单
      if (document.getElementById('formView') && document.getElementById('fpvStudentList')) renderForm();
    } catch(e){ console.error('loadCloudRoster', e); }
  }).catch(function(){});
}

// ========== Toast ==========
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

// ========== Form ==========
var fpvSelectedType = null;
var fpvScore = 1;
var fpvPhotoData = null;
var fpvWeek = null;   // 本次提交归属的周次（可选，默认当前周）

// 计算当天所属学年第几周（ISO 周，第1周为含1月4日的周）
function computeWeekOfYear(now) {
  var d = new Date(now.getTime ? now.getTime() : now);
  d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}
// 集合收集表周次区间为 1~21（学期周次），默认周钳制在此范围内保证可下拉选择
function currentCollectWeek() {
  var w = computeWeekOfYear(new Date());
  return w < 1 ? 1 : (w > 21 ? 21 : w);
}
// 读取分发链接中的 ?week= 参数（若有则作为默认收集周），钳制到 1~21
function collectWeekFromUrl() {
  try {
    var m = location.search.match(/[?&]week=([0-9]+)/i);
    if (m) {
      var w = parseInt(m[1], 10);
      if (!isNaN(w) && w >= 1 && w <= 52) return Math.min(w, 21);
    }
  } catch(e){}
  return null;
}

var typeOptions = [
  {key:'1.黑板报/广播稿', dim:'d1', scoreType:'加分'}, {key:'2.好人好事', dim:'d2', scoreType:'加分'},
  {key:'3.志愿者/比赛', dim:'d3', scoreType:'加分'}, {key:'4.班干部', dim:'d4', scoreType:'加分'},
  {key:'5.团体活动', dim:'d5', scoreType:'加分'}, {key:'6.班级卫生/晨检', dim:'d6', scoreType:'减分'},
  {key:'7.宿舍/手机', dim:'d7', scoreType:'减分'}, {key:'8.晚修纪律', dim:'d8', scoreType:'减分'},
  {key:'9.课堂/作业', dim:'d9', scoreType:'减分'}, {key:'10.课堂加分', dim:'d10', scoreType:'加分'},
  {key:'11.出勤/仪容', dim:'d11', scoreType:'减分'}
];
var dimNames = { d1:'黑板报/广播稿', d2:'好人好事', d3:'志愿者/比赛', d4:'班干部', d5:'团体活动', d6:'班级卫生', d7:'宿舍/手机', d8:'晚修纪律', d9:'课堂/作业', d10:'课堂加分', d11:'出勤/仪容' };

function renderForm() {
  document.body.style.overflow = 'auto';
  var container = document.getElementById('formView');

  // 周次下拉：第1~21周，默认当前周；若分发链接带 ?week= 则自动选择并锁定
  var urlW = collectWeekFromUrl();
  var curW = urlW || currentCollectWeek();
  var weekOptions = Array.apply(null, { length: 21 }).map(function(_, i) {
    var w = i + 1;
    return '<option value="' + w + '"' + (w === curW ? ' selected' : '') + '>第' + w + '周' + (w === curW ? '（本周）' : '') + '</option>';
  }).join('');

  var studentOptions = students.map(function(s, i) {
    return '<label class="fpv-check"><input type="checkbox" value="' + i + '"><span>' + s.name + '</span><span class="fpv-check-count">' + s.fullId + '</span></label>';
  }).join('');

  var typeHtml = typeOptions.map(function(t, i) {
    return '<div class="vi-type-option" data-idx="' + i + '" onclick="selectType(this, ' + i + ', ' + JSON.stringify(t).replace(/"/g, '&quot;') + ')">' + t.key + '</div>';
  }).join('');

  container.innerHTML =
    '<div class="fpv-header"><h2>📊 品德操行数据收集表</h2><p>班干部填写操行数据，提交后按周汇总至操行表格记录</p></div>' +
    '<div class="fpv-section"><label><span class="req">*</span>0. 选择所属周次</label><select id="fpvWeek"' + (urlW ? ' disabled' : '') + '>' + weekOptions + '</select>' + (urlW ? '<div style="font-size:11px;color:var(--success-dark);margin-top:4px">✅ 已按分发设置自动选择：第' + curW + '周（无需手动修改）</div>' : '<div style="font-size:11px;color:var(--text-3);margin-top:4px">提交的数据会计入所选周的操行表格记录，默认本周</div>') + '</div>' +
    '<div class="fpv-section"><label><span class="req">*</span>1. 选择学生（可多选）</label><div id="fpvStudentList" class="fpv-check-list">' + studentOptions + '</div><div style="font-size:11px;color:var(--text-3);margin-top:4px">可勾选一名或多名学生，提交时按所选维度与分值批量录入</div></div>' +
    '<div class="fpv-section"><label><span class="req">*</span>2. 选择录入维度</label><div class="fpv-types" id="fpvTypes">' + typeHtml + '</div></div>' +
    '<div class="fpv-section"><label><span class="req">*</span>3. 填写数据</label><textarea id="fpvDesc" rows="3" placeholder="描述具体情况，如：制作黑板报获一等奖..."></textarea></div>' +
    '<div class="fpv-section"><label>分值</label><div class="fpv-score-row"><button class="btn btn-sm" onclick="adjustScore(-1)">−</button><input type="text" id="fpvScore" value="1" readonly><button class="btn btn-sm" onclick="adjustScore(1)">+</button><span id="fpvScoreType" style="font-size:12px;color:var(--text-3);margin-left:4px">分</span></div></div>' +
    '<div class="fpv-section"><label>上传图片佐证（可选）</label><div class="fpv-upload" onclick="document.getElementById(\'fpvPhotoInput\').click()"><div id="fpvUploadPlaceholder"><div style="font-size:36px">📸</div><div style="font-size:13px;color:var(--text-3);margin-top:8px">点击拍照或选择图片</div></div><img id="fpvPhotoPreview" style="display:none;width:100%;border-radius:8px;margin-top:8px"></div><input type="file" id="fpvPhotoInput" accept="image/*" capture="environment" style="display:none" onchange="previewPhoto(this)"></div>' +
    '<button class="fpv-submit" onclick="submitForm()">提交</button>';

  fpvSelectedType = null;
  fpvScore = 1;
  fpvPhotoData = null;
  fpvWeek = curW;
  document.getElementById('fpvWeek').value = fpvWeek;
}

function selectType(el, idx, typeInfo) {
  document.querySelectorAll('#fpvTypes .vi-type-option').forEach(function(o) { o.classList.remove('selected'); });
  el.classList.add('selected');
  fpvSelectedType = typeInfo;
  fpvScore = 1;
  document.getElementById('fpvScore').value = '1';
  var typeEl = document.getElementById('fpvScoreType');
  if (typeInfo.scoreType) {
    typeEl.textContent = typeInfo.scoreType;
    typeEl.style.color = typeInfo.scoreType === '加分' ? 'var(--success-dark)' : 'var(--danger)';
  }
}

function adjustScore(delta) {
  fpvScore = Math.max(1, fpvScore + delta);
  document.getElementById('fpvScore').value = fpvScore;
}

function previewPhoto(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    fpvPhotoData = e.target.result;
    var preview = document.getElementById('fpvPhotoPreview');
    var placeholder = document.getElementById('fpvUploadPlaceholder');
    preview.src = e.target.result;
    preview.style.display = 'block';
    placeholder.style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function submitForm() {
  if (!fpvSelectedType) { showToast('请选择录入维度'); return; }
  // 读取勾选的学生（可多选）
  var chks = document.querySelectorAll('#fpvStudentList input[type=checkbox]:checked');
  var idxs = [];
  chks.forEach(function(el){ idxs.push(parseInt(el.value, 10)); });
  if (!idxs.length) { showToast('请至少选择一名学生'); return; }
  var desc = document.getElementById('fpvDesc').value.trim() || '未填写描述';
  var weekEl = document.getElementById('fpvWeek');
  if (fpvWeek === null) fpvWeek = collectWeekFromUrl() || currentCollectWeek();
  var week = weekEl && weekEl.value ? weekEl.value : String(fpvWeek);

  var dim = fpvSelectedType.dim;
  var records = loadCollectRecords();
  var names = [];

  idxs.forEach(function(idx) {
    var s = students[idx];
    if (!s) return;
    s.conduct[dim] += fpvScore;
    if (fpvSelectedType.scoreType === '加分') s.conduct.total += fpvScore;
    else s.conduct.total -= fpvScore;

    // 保存提交记录到共享存储（localStorage），触发PC/手机原型storage事件同步
    records.push({
      fullId: s.fullId,
      dim: dim,
      score: fpvScore,
      scoreType: fpvSelectedType.scoreType,
      desc: desc,
      photo: fpvPhotoData,
      week: String(week),
      ts: new Date().toISOString()
    });
    names.push(s.name);
    // 若配置了 Supabase，则写入云端数据库（真正跨设备回传）
    if (sbEnabled()) {
      sbInsert('conduct_records', {
        full_id: s.fullId, name: s.name, dim: dim,
        score: fpvScore, score_type: fpvSelectedType.scoreType,
        description: desc, photo: (fpvPhotoData || '').substring(0, 60000),
        week: String(week),
        device: (navigator.userAgent || '').substring(0, 40)
      });
    }
  });

  saveCollectRecords(records);
  // 通知同源打开的原型有新数据
  try { window.dispatchEvent(new StorageEvent('storage', { key: COLLECT_STORAGE_KEY, newValue: JSON.stringify(records) })); } catch(e){}

  var container = document.getElementById('formView');
  container.innerHTML =
    '<div class="fpv-success"><div class="icon">✅</div><h3>提交成功！</h3><p>' + names.join('、') + ' 的' + (dimNames[dim]||'') + '数据已记录' + (sbEnabled() ? '并上传云端' : '并同步至PC端/手机端原型') + '</p>' +
    '<p style="margin-top:16px"><button class="fpv-submit" style="margin-top:16px" onclick="renderForm()">继续填写</button></p></div>';
}

// Auto-render on load
document.addEventListener('DOMContentLoaded', function(){ renderForm(); loadCloudRoster(); });
</script>
</body>
</html>
